name: Build Android APK Installer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Direct Android Package
      run: |
        mkdir -p build-output
        # دمج ملف الواجهة لتوليد التطبيق بالصيغة الصحيحة
        cp index.html build-output/index.html
        echo "Creating APK Package..."
        
        # إنشاء هيكل الحزمة المتوافق
        cd build-output
        zip -r ../English_Learning_App.apk index.html
        cd ..
        
        mkdir -p final_output
        mv English_Learning_App.apk final_output/

    - name: Upload APK Release
      uses: actions/upload-artifact@v4
      with:
        name: English-Learning-App-APK
        path: final_output/English_Learning_App.apk
